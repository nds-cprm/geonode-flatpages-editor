name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # GeoNode 5.0.x
          - python: "3.12"
            django: "5.2.*"
            tinymce: "3.7.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django==${{ matrix.django }}" "django-tinymce==${{ matrix.tinymce }}" flake8 -e .
      - run: flake8
      - run: python runtests.py
